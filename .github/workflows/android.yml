
name: Build MSEDCL Sorter Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          set -e
          unzip -q MSEDCL_Sorter_Android_Project_V3.zip -d extracted
          ls -la extracted/MSEDCL_Sorter_Android_V2

      - name: Download offline libraries
        working-directory: extracted/MSEDCL_Sorter_Android_V2
        run: |
          set -e
          mkdir -p app/src/main/assets/www/libs

          curl -fL --retry 3 \
          https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js \
          -o app/src/main/assets/www/libs/xlsx.bundle.js

          curl -fL --retry 3 \
          https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js \
          -o app/src/main/assets/www/libs/jszip.min.js

          curl -fL --retry 3 \
          https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js \
          -o app/src/main/assets/www/libs/pdf.min.js

          curl -fL --retry 3 \
          https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js \
          -o app/src/main/assets/www/libs/pdf.worker.min.js

          curl -fL --retry 3 \
          https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js \
          -o app/src/main/assets/www/libs/pdf-lib.min.js

      - name: Build Android APK
        working-directory: extracted/MSEDCL_Sorter_Android_V2
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSEDCL-Sorter-Android-APK
          path: extracted/MSEDCL_Sorter_Android_V2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
